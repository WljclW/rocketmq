brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# namesrv服务地址
namesrvAddr = 127.0.0.1:9876
# 运行自动创建topic，避免调试的时候麻烦
autoCreateTopicEnable = true
# 数据存储路径
storePathRootDir = D:/IDEA_projects/STORE_DATA/ROCKETMQ_DATA
# commitlog存储文件
storePathCommitLog = D:/IDEA_projects/STORE_DATA/ROCKETMQ_DATA/commitlog
# 消费队列存储文件
storePathConsumeQueue =  D:/IDEA_projects/STORE_DATA/ROCKETMQ_DATA/consumequeue
# 索引存储文件
storePathIndex =  D:/IDEA_projects/STORE_DATA/ROCKETMQ_DATA/index
# checkpoint存储文件
storeCheckpoint = D:/IDEA_projects/STORE_DATA/ROCKETMQ_DATA/checkpoint
# abort文件
abortFile =  D:/IDEA_projects/STORE_DATA/ROCKETMQ_DATA/abort

